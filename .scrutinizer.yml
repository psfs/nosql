filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*

checks:
  php: true

tools:
  php_cs_fixer:
    config:
      level: psr12

build:
  environment:
    docker: true
    variables:
      PHP_VERSION: "8.3"
      DEBUG: "-xdebug"
  nodes:
    analysis: false
    code-analysis:
      commands:
        - checkout-code ~/build
        - cd ~/build && docker-compose up -d php redis nosql
        - cd ~/build && docker-compose exec -T php sh prepare-test-runtime.sh
        - cd ~/build && docker-compose exec -T php composer install -o --no-interaction --no-progress --prefer-dist
        - cd ~/build && php-scrutinizer-run
    services-tests:
      commands:
        - checkout-code ~/build
        - cd ~/build && docker-compose up -d php redis nosql
        - cd ~/build && docker-compose exec -T php sh prepare-test-runtime.sh
        - cd ~/build && docker-compose exec -T php composer install -o --no-interaction --no-progress --prefer-dist
        - command: cd ~/build && docker-compose exec -T -e PSFS_REDIS_HOST=redis -e APP_ENVIRONMENT=test php sh scrutinizer-tests.sh
          idle_timeout: 1200
