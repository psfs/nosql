filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*

checks:
  php: true

tools:
  php_cs_fixer:
    config:
      level: psr12

build:
  environment:
    php:
      version: "8.3.33"
      pecl_extensions: []
      ini:
        memory_limit: "-1"
  nodes:
    analysis:
      commands:
        - checkout-code ~/build
        - cd ~/build && sh prepare-test-runtime.sh
        - cd ~/build && composer install -o --no-interaction --no-progress --prefer-dist
        - cd ~/build && php-scrutinizer-run
    services-tests:
      services:
        mongo: "8"
        redis: "6"
      environment:
        variables:
          APP_ENVIRONMENT: "test"
          PSFS_REDIS_HOST: "127.0.0.1"
          PSFS_REDIS_PORT: "6379"
          PSFS_REDIS_TIMEOUT: "1.5"
      commands:
        - checkout-code ~/build
        - cd ~/build && sh prepare-test-runtime.sh
        - cd ~/build && composer install -o --no-interaction --no-progress --prefer-dist
        - command: cd ~/build && sh scrutinizer-tests.sh
          idle_timeout: 1200
