filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*

checks:
  php: true

tools:
  php_cs_fixer:
    config:
      level: psr12

build:
  environment:
    php:
      version: "8.3.33"
      compile_options: "--without-pear"
      pecl_extensions: []
      ini:
        memory_limit: "-1"
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
    services-tests:
      services:
        mongo: "8"
        redis: "6"
      environment:
        variables:
          APP_ENVIRONMENT: "test"
          PSFS_REDIS_HOST: "127.0.0.1"
          PSFS_REDIS_PORT: "6379"
          PSFS_REDIS_TIMEOUT: "1.5"
      dependencies:
        override:
          - sh prepare-test-runtime.sh
          - composer install -o --no-interaction --no-progress --prefer-dist
      project_setup:
        override:
          - true
      tests:
        stop_on_failure: true
        override:
          - sh scrutinizer-tests.sh
